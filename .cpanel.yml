---
deployment:
  tasks:
    # 1. Define the path to your Laravel project within the repository
    # CHANGE 'repositories/aahaapps' to your actual cPanel repo path
    - export REPOPATH=$HOME/repositories/aahaapps-live/AahaApps_Laravel
    
    # 2. Enter the directory
    - cd $REPOPATH
    
    # 3. Install PHP dependencies (Download composer.phar locally first because global doesn't work)
    - /usr/local/bin/ea-php82 -d allow_url_fopen=1 -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - /usr/local/bin/ea-php82 -d allow_url_fopen=1 composer-setup.php
    - /usr/local/bin/ea-php82 -d allow_url_fopen=1 composer.phar install --no-dev --optimize-autoloader
    - rm composer-setup.php
    - rm composer.phar
    
    # 4. Run database migrations (Ensure .env is set up first!)
    - /usr/local/bin/ea-php82 artisan migrate --force
    
    # 5. Clear caches
    - /usr/local/bin/ea-php82 artisan config:cache
    - /usr/local/bin/ea-php82 artisan route:cache
    - /usr/local/bin/ea-php82 artisan view:cache
    
    # 6. Link Storage (creates public/storage symlink)
    - /usr/local/bin/ea-php82 artisan storage:link
